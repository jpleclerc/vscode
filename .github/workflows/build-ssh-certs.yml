name: Build Code - OSS (ssh-certs)

on:
  push:
    branches:
      - build/stable-1.143.1-ssh-certs
  workflow_dispatch:

permissions:
  contents: read

env:
  VSCODE_ARCH: x64
  npm_config_arch: x64
  npm_config_foreground_scripts: "true"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Report upstream 1.143.1's commit so remote agent hosts can download the matching official CLI
  BUILD_SOURCEVERSION: e646868227c3e3a9e3f24277c8c7220be42c0be7

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install system dependencies
        run: |
          ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get update
          ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get install -y pkg-config \
            libxkbfile-dev libkrb5-dev libsecret-1-dev libx11-dev python-is-python3 fakeroot dpkg-dev rpm

      - name: Install build dependencies
        working-directory: build
        run: |
          for i in 1 2 3; do npm ci && break; [ $i -eq 3 ] && exit 1; sleep 5; done

      # Uses the same Chromium clang + glibc 2.28 sysroot toolchain as upstream CI
      - name: Install npm dependencies
        run: |
          set -e
          source ./build/azure-pipelines/linux/setup-env.sh
          for i in 1 2 3; do npm ci && break; [ $i -eq 3 ] && exit 1; sleep 5; done

      - name: Build client
        run: npm run gulp vscode-linux-x64-min

      - name: Package tarball
        run: |
          mkdir -p dist
          tar -czf dist/code-oss-linux-x64.tar.gz -C .. VSCode-linux-x64

      - name: Build .rpm
        continue-on-error: true
        run: |
          npm run gulp vscode-linux-x64-prepare-rpm
          npm run gulp vscode-linux-x64-build-rpm
          cp .build/linux/rpm/*/*.rpm dist/

      - uses: actions/upload-artifact@v4
        with:
          name: code-oss-linux-x64
          path: dist/*
          compression-level: 0

  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - name: Disable git autocrlf
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install npm dependencies
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            npm ci
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq 3) { throw "npm ci failed" }
            Start-Sleep -Seconds 5
          }

      # The packaging step calls signtool.exe to strip stale signatures from native binaries
      - name: Add Windows SDK signtool to PATH
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          Split-Path $signtool.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build client
        shell: pwsh
        run: |
          npm run gulp vscode-win32-x64-min
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          npm run gulp vscode-win32-x64-inno-updater
          if ($LASTEXITCODE -ne 0) { throw "inno-updater failed" }

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path ..\VSCode-win32-x64\* -DestinationPath dist\code-oss-win32-x64.zip

      - name: Build user installer
        continue-on-error: true
        shell: pwsh
        run: |
          npm run gulp vscode-win32-x64-user-setup
          if ($LASTEXITCODE -ne 0) { throw "user setup failed" }
          Copy-Item .build\win32-x64\user-setup\*.exe dist\

      - uses: actions/upload-artifact@v4
        with:
          name: code-oss-win32-x64
          path: dist/*
          compression-level: 0

  macos:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 300
    env:
      VSCODE_ARCH: arm64
      npm_config_arch: arm64
      # Avoid dlopen-based Kerberos loading on macOS (matches upstream CI)
      GYP_DEFINES: "kerberos_use_rtld=false"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install npm dependencies
        run: |
          set -e
          python3 -m pip install --break-system-packages setuptools
          for i in 1 2 3; do npm ci && break; [ $i -eq 3 ] && exit 1; sleep 5; done

      - name: Build client
        run: npm run gulp vscode-darwin-arm64-min

      # Unsigned binaries are rejected on Apple Silicon; an ad-hoc signature lets the app run locally
      - name: Ad-hoc sign app
        run: |
          set -e
          APP="$(ls -d ../VSCode-darwin-arm64/*.app)"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Package zip
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$(ls -d ../VSCode-darwin-arm64/*.app)" dist/code-oss-darwin-arm64.zip

      - name: Build .dmg
        continue-on-error: true
        env:
          VSCODE_QUALITY: stable
        run: |
          set -e
          mkdir -p .build/dmg
          node build/darwin/create-dmg.ts .. "$PWD/.build/dmg"
          cp .build/dmg/*.dmg dist/

      - uses: actions/upload-artifact@v4
        with:
          name: code-oss-darwin-arm64
          path: dist/*
          compression-level: 0
