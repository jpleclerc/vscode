name: Validate PR branch

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to validate
        required: true
      base:
        description: Base commit for changed-file checks
        required: true
      tests:
        description: Space-separated test files (src/...test.ts) to run with test-node
        required: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      VSCODE_ARCH: x64
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 5

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libx11-xcb-dev libxkbfile-dev libnotify-bin libkrb5-dev libsecret-1-dev

      - name: Install build dependencies
        working-directory: build
        run: npm ci

      - name: Install dependencies
        run: |
          set -e
          node build/npm/preinstall.ts
          source ./build/azure-pipelines/linux/setup-env.sh
          for i in 1 2 3; do npm ci && break; [ $i -eq 3 ] && exit 1; sleep 5; done

      - name: Electron types
        run: node build/npm/electronTypes.ts

      - name: Typecheck
        run: npm exec -- npm-run-all2 -lp typecheck-client tsec-compile-check

      - name: Hygiene and ESLint (changed files)
        if: always()
        run: npm exec -- npm-run-all2 -lp --continue-on-error "hygiene -- --changed-since ${{ inputs.base }}" "eslint -- --changed-since ${{ inputs.base }}"

      - name: Layers check
        if: always()
        run: npm run valid-layers-check

      - name: Transpile
        if: always()
        run: npm run transpile-client

      - name: Unit tests
        if: always()
        run: |
          set -e
          for t in ${{ inputs.tests }}; do
            npm run test-node -- --run "$t"
          done
